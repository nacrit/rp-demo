<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token</title>
    <style>
        :root {
            --pri: #85aae8;
            --btn: #5c54e5;
            --suc: #10b981;
            --dan: #ef6344;
            --bg: #f9fafb;
            --txt: #1f2937;
            --bor: #d1d5db;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: system-ui, sans-serif;
            background: var(--bg);
            color: var(--txt);
            min-height: 100vh;
        }

        .container { max-width: 900px; margin: 0 auto; }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            color: var(--pri);
            margin: 0 0 1rem;
        }

        .stats {
            text-align: center;
            margin: 0.8rem 0 1.2rem;
            color: #4b5563;
        }

        .stats strong { color: var(--pri); }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid var(--bor);
            border-radius: 6px;
        }

        input:focus {
            outline: none;
            border-color: var(--pri);
            box-shadow: 0 0 0 2px rgba(79,70,229,0.2);
        }

        button {
            padding: 10px 20px;
            font-size: 15px;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
        }

        button[type="submit"] { background: var(--btn); }

        .btn {
            float: left;
            margin: 1.2rem 1rem;
            background: var(--dan);
            display: block;
        }

        .result {
            text-align: center;
            margin: 0.8rem 0;
            color: var(--suc);
            min-height: 1.2em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 6px rgba(0,0,0,0.08);
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--bor);
        }

        th {
            background: var(--pri);
            color: white;
            font-weight: 600;
        }

        .token-cell {
            font-family: monospace;
            word-break: break-all;
            font-size: 13.5px;
            line-height: 1.4;
        }

        .copy-cell { text-align: center; width: 100px; }

        .copy-button {
            padding: 6px 14px;
            background: var(--suc);
            font-size: 13px;
        }

        .copy-status {
            margin-top: 4px;
            font-size: 12px;
            color: var(--suc);
            min-height: 1.2em;
        }

        @media (max-width: 560px) {
            .form-row { flex-direction: column; gap: 8px; }
            button { width: 100%; padding: 12px; }
            .copy-cell { width: auto; }
            th, td { padding: 8px 10px; font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="stats">总数：<strong id="count">0</strong></div>

    <div class="form-row">
        <form action="/login/add" method="post">
            <input name="token" placeholder="token" th:value="${token}">
            <button type="submit">添加</button>
        </form>
    </div>

    <div class="form-row">
        <form action="/login/red-p" method="post">
            <input name="code" placeholder="code" th:value="${code}">
            <button type="submit">Open</button>
        </form>
    </div>

    <div class="result" th:text="${result}"></div>

    <button id="clearButton" class="btn">Clear</button>
    <button id="saveButton" class="btn">Save</button>
    <button id="loadButton" class="btn">Load</button>

    <table>
        <thead>
        <tr>
            <th>备注</th>
            <th>Token</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody id="tbody">
        <tr th:each="r : ${results}">
            <td th:text="${r.split(':')[1]}"></td>
            <td class="token-cell" th:text="${r.split(':')[0]}"></td>
            <td class="copy-cell">
                <button class="copy-button">复制</button>
                <div class="copy-status"></div>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    function updateCount() {
        document.getElementById('count').textContent =
            document.querySelectorAll('#tbody tr').length;
    }

    document.addEventListener('DOMContentLoaded', () => {
        updateCount();

        document.querySelectorAll('.copy-button').forEach(btn => {
            btn.onclick = e => {
                e.preventDefault();
                const row = btn.closest('tr');
                const token = row.cells[1].textContent.trim();
                const status = row.querySelector('.copy-status');

                navigator.clipboard.writeText(token).then(() => {
                    status.textContent = '已复制';
                    setTimeout(() => status.textContent = '', 1800);
                }).catch(() => {
                    status.textContent = '失败';
                    setTimeout(() => status.textContent = '', 1800);
                });
            };
        });

        document.getElementById('clearButton').onclick = e => {
            e.preventDefault();
            if (!confirm('clear？')) return;
            fetch('/login/clear', { method: 'POST', body: '' })
                .then(r => r.ok ? location.reload() : alert('失败'))
                .catch(() => alert('请求错误'));
        };

        document.getElementById('saveButton').onclick = e => {
            e.preventDefault();
            if (!confirm('save？')) return;
            fetch('/login/save', { method: 'POST', body: '' })
                .then(r => r.ok ? location.reload() : alert('失败'))
                .catch(() => alert('请求错误'));
        };

        document.getElementById('loadButton').onclick = e => {
            e.preventDefault();
            if (!confirm('load？')) return;
            fetch('/login/load', { method: 'POST', body: '' })
                .then(r => r.ok ? location.reload() : alert('失败'))
                .catch(() => alert('请求错误'));
        };
    });
</script>
</body>
</html>
